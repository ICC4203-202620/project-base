services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodie
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: foodie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie -d foodie"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://foodie:foodie@db:5432/foodie
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SEED_DEMO_USER: "true"
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
  gateway:
    build: ./gateway
    depends_on:
      - backend
      - frontend
    environment:
      LOCAL_TLS: ${LOCAL_TLS:-false}
    ports:
      - "${GATEWAY_HTTP_PORT:-5173}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/certs:ro
  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodie_test
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: foodie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie -d foodie_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://foodie:foodie@test-db:5432/foodie_test
      TEST_DATABASE_URL: postgresql+psycopg://foodie:foodie@test-db:5432/foodie_test
      JWT_SECRET: test-only-secret-do-not-use-in-production
      SEED_DEMO_USER: "true"
    entrypoint: ["/bin/sh", "/app/test-entrypoint.sh"]
volumes:
  postgres-data:
  frontend-node-modules:

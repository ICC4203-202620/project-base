map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /certs/local.pem;
  ssl_certificate_key /certs/local-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:LocalTLS:10m;
  ssl_session_timeout 10m;

  include /etc/nginx/configurations/routes.conf;
}

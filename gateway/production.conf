# nginx del despliegue. Sirve el build estático del frontend y hace proxy de la
# API hacia el backend, conservando el origen único de la arquitectura local.
#
# TLS termina en el nginx del servidor, que envía el tráfico a este contenedor
# por HTTP. Por eso X-Forwarded-Proto se propaga tal como llega y sólo se
# calcula desde $scheme cuando la cabecera está ausente: el backend construye
# con ella el origen que compara contra la cabecera Origin del navegador.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location /api/ {
    client_max_body_size 12m;
    proxy_request_buffering off;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /healthz {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /openapi.json {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # El service worker no se cachea: una copia vieja congelaría la aplicación en
  # una versión anterior. Service-Worker-Allowed permite registrarlo con scope
  # "/" aunque el archivo se sirva desde otra ruta. Ajusta el nombre si tu
  # grupo publicó el archivo con otro.
  location ~ ^/(sw|service-worker)\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location ~ ^/(manifest\.webmanifest|manifest\.json)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Vite escribe aquí los archivos con hash de contenido: su nombre cambia con
  # cada build, de modo que pueden cachearse indefinidamente.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Rutas de la aplicación de página única. Una URL profunda recargada debe
  # devolver index.html para que el router del cliente la resuelva.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
